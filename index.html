<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewsPrism - 三原色で拓く時事ニュースデスク</title>
  <!-- ファビコン・アプリアイコン設定 -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root {
      --bg-dark: #0f1117;
      --card-bg: #181c26;
      --card-border: #262c3d;
      --text-main: #f0f3f8;
      --text-sub: #9ca3af;
      --accent: #6366f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ヘッダー */
    header {
      background: #141721;
      border-bottom: 1px solid var(--card-border);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 16px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-area h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ff4d4d, #4ade80, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .spectrum-legend {
      display: flex;
      gap: 14px;
      font-size: 0.75rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    /* 日付セレクターUI */
    .date-control-area {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    .date-nav-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .date-nav-btn:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
    }
    .date-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .date-select {
      background: #11141d;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .balance-meter {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
    }
    .balance-orb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    /* メインコンテナ */
    .app-body {
      display: flex;
      flex: 1;
      height: calc(100vh - 65px);
      overflow: hidden;
    }

    /* 左ペイン: 2Dカラー散布図 + フィルター */
    .left-panel {
      width: 480px;
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      padding: 20px;
      background: #11141d;
      flex-shrink: 0;
    }

    .map-header {
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .map-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }
    .map-subtitle {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .canvas-container {
      position: relative;
      width: 440px;
      height: 440px;
      background: #090b10;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      overflow: hidden;
    }

    #scatterCanvas {
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .axis-label {
      position: absolute;
      font-size: 0.75rem;
      color: var(--text-sub);
      pointer-events: none;
      font-weight: 500;
    }
    .label-top { top: 8px; left: 50%; transform: translateX(-50%); color: #f87171; }
    .label-bottom { bottom: 8px; left: 50%; transform: translateX(-50%); color: #94a3b8; }
    .label-left { top: 50%; left: 8px; transform: translateY(-50%); color: #94a3b8; }
    .label-right { top: 50%; right: 8px; transform: translateY(-50%); color: #4ade80; }

    /* 第3軸（事実度）スライダーエリア */
    .slider-area {
      margin-top: 20px;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }
    .blue-label {
      color: #60a5fa;
      font-weight: 600;
    }
    input[type=range] {
      width: 100%;
      accent-color: #3b82f6;
    }

    /* 右ペイン: ニュースリスト */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 24px;
      overflow-y: auto;
    }

    .feed-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .tag-filters {
      display: flex;
      gap: 8px;
    }
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--accent);
      color: var(--text-main);
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .news-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .news-card.selected {
      border-color: #fff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
    }

    /* 記事カードの左端RGB発光バー */
    .color-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
    }

    .card-header-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      padding-left: 8px;
    }
    .badge-wrap {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .color-tag {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      color: #000;
    }
    .source-text {
      color: var(--text-sub);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.4;
      padding-left: 8px;
    }

    .card-summary {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.5;
      padding-left: 8px;
    }

    .rgb-breakdown {
      display: flex;
      gap: 16px;
      font-size: 0.75rem;
      color: var(--text-sub);
      padding-left: 8px;
      margin-top: 4px;
    }
    .rgb-item span {
      font-weight: 600;
    }

    /* モーダル（異論クッション・詳細） */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      cursor: pointer;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: #181d28;
      border: 1px solid var(--card-border);
      width: 580px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      cursor: default;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .ai-cushion-box {
      background: rgba(239, 68, 68, 0.08);
      border-left: 3px solid #ef4444;
      padding: 12px 14px;
      border-radius: 4px;
      margin: 14px 0;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .ai-cushion-box.aligned {
      background: rgba(74, 222, 128, 0.08);
      border-left-color: #4ade80;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-original {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
    }
    .btn-close {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .share-btn {
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      cursor: pointer;
      margin-left: 6px;
      transition: all 0.2s;
    }
    .share-btn:hover {
      background: var(--accent);
    }

    .reaction-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .reaction-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--accent);
    }

    /* --- レスポンシブ & モバイル改善 (画面幅900px以下) --- */
    @media (max-width: 900px) {
      body {
        overflow-y: auto;
        height: auto;
        min-height: 100vh;
      }

      header {
        flex-wrap: wrap;
        padding: 10px 14px;
        gap: 10px;
      }

      .spectrum-legend {
        display: none; /* スマホではヘッダーの凡例を非表示にして省スペース化 */
      }

      .date-control-area {
        order: 2;
      }

      .balance-meter {
        order: 3;
        width: 100%;
        justify-content: center;
      }

      .app-body {
        flex-direction: column;
        height: auto;
        overflow: visible;
      }

      .left-panel {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--card-border);
        padding: 16px;
        align-items: center;
      }

      .canvas-container {
        width: 100%;
        max-width: 360px;
        height: 360px;
      }

      #scatterCanvas {
        width: 100%;
        height: 100%;
      }

      .slider-area {
        width: 100%;
        max-width: 360px;
      }

      .right-panel {
        padding: 16px 14px;
        overflow-y: visible;
      }

      .tag-filters {
        overflow-x: auto;
        padding-bottom: 6px;
        max-width: 100%;
        -webkit-overflow-scrolling: touch;
      }

      .filter-btn {
        white-space: nowrap;
        flex-shrink: 0;
      }

      .modal-box {
        width: 92%;
        max-height: 90vh;
        padding: 18px;
      }
    }
  </style>

  <!-- 自動生成された最新ニュースデータの読み込み -->
  <script src="news_data.js?v=20261101005122"></script>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <div class="logo-area">
      <img src="icon.png" alt="NewsPrism Icon" style="width:30px; height:30px; border-radius:7px; box-shadow:0 0 10px rgba(99,102,241,0.5); object-fit:cover;">
      <h1>NewsPrism</h1>
      <div class="spectrum-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#ff4d4d"></div>赤: 興味</div>
        <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div>緑: 思想近さ</div>
        <div class="legend-item"><div class="legend-dot" style="background:#60a5fa"></div>青: 客観事実</div>
      </div>
    </div>

    <!-- 日付セレクター（過去ニュースへの切り替え） -->
    <div class="date-control-area">
      <button class="date-nav-btn" id="prevDateBtn" onclick="navigateDate(1)">◀ 前日</button>
      <select class="date-select" id="dateSelect" onchange="onDateChange(this.value)">
        <!-- 動的に日付オプションが挿入されます -->
      </select>
      <button class="date-nav-btn" id="nextDateBtn" onclick="navigateDate(-1)">翌日 ▶</button>
    </div>

    <div class="balance-meter">
      <span>摂取バランス:</span>
      <div class="balance-orb" id="userBalanceOrb"></div>
      <span id="balanceText" style="color:#fcd34d;">計算中...</span>
      <button class="share-btn" onclick="generateShareCard()" title="本日の摂取バランス画像を生成して共有">📤 シェア</button>
    </div>
  </header>

  <!-- メインエリア -->
  <div class="app-body">
    <!-- 左ペイン: 2Dマップ & 青スライダー -->
    <div class="left-panel">
      <div class="map-header">
        <div class="map-title">立体スペクトラム空間</div>
        <div class="map-subtitle">粒子をクリックして記事選択</div>
      </div>

      <div class="canvas-container">
        <div class="axis-label label-top">▲ 興味：高 (Red)</div>
        <div class="axis-label label-bottom">▼ 興味：低</div>
        <div class="axis-label label-left">◀ 思想：遠 (異論)</div>
        <div class="axis-label label-right">思想：近 (Green) ▶</div>
        <canvas id="scatterCanvas" width="440" height="440"></canvas>
      </div>

      <div class="slider-area">
        <div class="slider-header">
          <span class="blue-label">第3軸：客観事実度フィルター (Blue)</span>
          <span id="factFilterValue">0% 以上</span>
        </div>
        <input type="range" id="factSlider" min="0" max="100" value="0">
        <div style="display:flex; justify-content:space-between; font-size:0.7rem; color:var(--text-sub); margin-top:4px;">
          <span>主観論評を含む</span>
          <span>純粋な一次データのみ</span>
        </div>
      </div>
    </div>

    <!-- 右ペイン: ニュースカード一覧 -->
    <div class="right-panel">
      <div class="feed-controls">
        <div class="tag-filters">
          <button class="filter-btn active" onclick="setPreset('all')">全表示</button>
          <button class="filter-btn" onclick="setPreset('white')">白 (神記事: 高関心×共感×事実)</button>
          <button class="filter-btn" onclick="setPreset('magenta')">マゼンタ (刺激的異論: 高関心×異論)</button>
          <button class="filter-btn" onclick="setPreset('cyan')">シアン (未知の事実: 低関心×事実)</button>
        </div>
        <div style="font-size:0.8rem; color:var(--text-sub);" id="articleCount">読み込み中...</div>
      </div>

      <div class="card-list" id="cardList">
        <!-- 記事カードが動的に挿入されます -->
      </div>
    </div>
  </div>

  <!-- 詳細・AIクッションモーダル -->
  <div class="modal-overlay" id="detailModal" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="color-tag" id="modalTag">混色オーラ</span>
          <span style="font-size:0.8rem; color:var(--text-sub);" id="modalSource">メディア名</span>
        </div>
        <span style="font-size:0.78rem; color:#94a3b8; font-weight:500;" id="modalDate">📅 配信日時</span>
      </div>
      <h2 class="modal-title" id="modalTitle">タイトル</h2>

      <!-- 3行要約ブロック -->
      <div id="modal3LinesBox" style="background:rgba(15,23,42,0.85); border:1px solid rgba(99,102,241,0.35); border-radius:10px; padding:14px 16px; margin:14px 0; box-shadow:0 4px 16px rgba(0,0,0,0.3);">
        <div style="font-size:0.8rem; font-weight:700; color:#a5b4fc; margin-bottom:10px; display:flex; align-items:center; gap:6px;">
          <span>📌 記事の深掘り3行要約（中身の理解）</span>
        </div>
        <div id="modal3LinesList" style="display:flex; flex-direction:column; gap:10px;">
        </div>
      </div>
      
      <div class="ai-cushion-box" id="modalCushion">
        <strong>【AI中立クッション】</strong><br>
        <span id="modalCushionText">解説文</span>
      </div>

      <p id="modalBody" style="font-size:0.88rem; line-height:1.6; color:#94a3b8; white-space:pre-wrap; border-top:1px solid var(--card-border); padding-top:10px;"></p>

      <!-- 4色リアクションボタン -->
      <div class="reaction-section" style="margin-top:16px; padding:12px; background:rgba(255,255,255,0.03); border-radius:8px; border:1px solid var(--card-border);">
        <div style="font-size:0.75rem; color:var(--text-sub); margin-bottom:8px; font-weight:600;">あなたの知覚リアクションを記録：</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="reaction-btn" onclick="saveReaction('agree')">💖 共感・納得</button>
          <button class="reaction-btn" onclick="saveReaction('dissent')">⚡ 刺激的異論</button>
          <button class="reaction-btn" onclick="saveReaction('insight')">💡 目から鱗</button>
          <button class="reaction-btn" onclick="saveReaction('fact')">📊 客観データ認定</button>
        </div>
      </div>

      <div class="modal-actions">
        <a href="#" target="_blank" class="btn-original" id="modalLink">元記事を読む ↗</a>
        <button class="btn-close" onclick="closeModal()">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    // 状態管理
    let availableDates = window.AVAILABLE_DATES || [];
    let currentDate = window.CURRENT_DATE || "";
    let currentNewsData = window.NEWS_DATA_TODAY || [];
    let currentFactFilter = 0;
    let selectedId = null;
    let activePreset = 'all';

    // 読了ログ & リアクションの管理 (localStorage)
    let readingHistory = [];
    let userReactions = {};
    try {
      readingHistory = JSON.parse(localStorage.getItem('newsprism_reading_log') || '[]');
      userReactions = JSON.parse(localStorage.getItem('newsprism_reactions') || '{}');
    } catch (e) {
      readingHistory = [];
      userReactions = {};
    }

    // リアクション保存
    function saveReaction(type) {
      if (!selectedId) return;
      userReactions[selectedId] = type;
      try {
        localStorage.setItem('newsprism_reactions', JSON.stringify(userReactions));
      } catch (e) {}

      // フィードバック表示
      const btnMap = {
        'agree': '💖 共感・納得を記録しました！',
        'dissent': '⚡ 刺激的異論を記録しました！',
        'insight': '💡 目から鱗の視点を記録しました！',
        'fact': '📊 客観データ認定を記録しました！'
      };
      alert(btnMap[type] || 'リアクションを保存しました');
      renderCards();
    }

    // 相対輝度(YIQ)に基づくテキストコントラスト自動判定 (WCAG AA準拠)
    function getContrastTextColor(r, g, b) {
      const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
      return (yiq >= 145) ? '#0f172a' : '#ffffff';
    }

    // 記事読了の記録
    function recordArticleRead(item) {
      readingHistory = readingHistory.filter(h => h.id !== item.id);
      readingHistory.unshift({
        id: item.id,
        title: item.title,
        r: item.r,
        g: item.g,
        b: item.b,
        timestamp: Date.now()
      });
      if (readingHistory.length > 25) readingHistory.pop(); // 最新25件を保存
      try {
        localStorage.setItem('newsprism_reading_log', JSON.stringify(readingHistory));
      } catch (e) {}
      updateUserBalance();
    }

    // DOM要素
    const canvas = document.getElementById('scatterCanvas');
    const ctx = canvas.getContext('2d');
    const cardList = document.getElementById('cardList');
    const factSlider = document.getElementById('factSlider');
    const factFilterValue = document.getElementById('factFilterValue');
    const userBalanceOrb = document.getElementById('userBalanceOrb');
    const dateSelect = document.getElementById('dateSelect');
    const prevDateBtn = document.getElementById('prevDateBtn');
    const nextDateBtn = document.getElementById('nextDateBtn');

    // 初期化
    function init() {
      setupDateSelector();
      loadDateData(currentDate, currentNewsData);

      factSlider.addEventListener('input', (e) => {
        currentFactFilter = parseInt(e.target.value);
        factFilterValue.textContent = `${currentFactFilter}% 以上`;
        renderCards();
        drawScatter();
      });

      canvas.addEventListener('click', handleCanvasClick);
    }

    // 日付ドロップダウンの設定
    function setupDateSelector() {
      dateSelect.innerHTML = '';
      availableDates.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = `${d} ${d === window.CURRENT_DATE ? '(最新)' : ''}`;
        dateSelect.appendChild(opt);
      });
      dateSelect.value = currentDate;
      updateNavButtons();
    }

    function updateNavButtons() {
      const idx = availableDates.indexOf(currentDate);
      // availableDates は降順 (新しい順)
      // 前日（過去）へ行く = idx が大きくなる
      prevDateBtn.disabled = (idx >= availableDates.length - 1);
      // 翌日（未来）へ行く = idx が小さくなる
      nextDateBtn.disabled = (idx <= 0);
    }

    function navigateDate(direction) {
      // direction: 1 (前日・過去へ), -1 (翌日・最新へ)
      const idx = availableDates.indexOf(currentDate);
      const targetIdx = idx + direction;
      if (targetIdx >= 0 && targetIdx < availableDates.length) {
        onDateChange(availableDates[targetIdx]);
      }
    }

    // 日付切り替え時のデータ読み込み
    function onDateChange(targetDate) {
      currentDate = targetDate;
      dateSelect.value = currentDate;
      updateNavButtons();

      if (targetDate === window.CURRENT_DATE && window.NEWS_DATA_TODAY) {
        loadDateData(targetDate, window.NEWS_DATA_TODAY);
      } else {
        // 過去日付のJSONファイルを非同期取得 (fetch)
        fetch(`data/news/${targetDate}.json`)
          .then(res => {
            if (!res.ok) throw new Error("File not found");
            return res.json();
          })
          .then(data => {
            loadDateData(targetDate, data);
          })
          .catch(err => {
            console.warn("Fetch failed, trying script tag load or fallback:", err);
            alert(`${targetDate} のニュースデータの読み込みに失敗しました。`);
          });
      }
    }

    function loadDateData(dateStr, data) {
      currentNewsData = data;
      selectedId = null;
      renderCards();
      drawScatter();
      updateUserBalance();
    }

    // 色の名前ラベル判定
    function getColorToneName(item) {
      if (item.r > 200 && item.g > 200 && item.b > 200) return "ホワイト (完全調和)";
      if (item.r > 180 && item.g < 80 && item.b < 100) return "マゼンタ (刺激的異論)";
      if (item.r > 180 && item.g > 160 && item.b < 80) return "イエロー (共感コラム)";
      if (item.r < 100 && item.g > 150 && item.b > 180) return "シアン (未知の客観事実)";
      if (item.b > 180) return "ブルー (冷静なファクト)";
      return "ミックススペクトラム";
    }

    // フィルター判定
    function isItemVisible(item) {
      const factPercent = (item.b / 255) * 100;
      if (factPercent < currentFactFilter) return false;

      if (activePreset === 'white') {
        // 白: 高関心 × 共感 × 事実
        return item.r >= 160 && item.g >= 160 && item.b >= 160;
      } else if (activePreset === 'magenta') {
        // マゼンタ: 高関心 × 異論
        return item.r >= 140 && item.g <= 130;
      } else if (activePreset === 'cyan') {
        // シアン: 低関心 × 高事実
        return item.r <= 140 && item.b >= 140;
      }
      return true; // 'all'
    }

    // 2D散布図の描画 (X: 思想近さ G, Y: 興味 R, 大きさ/輝度: 事実 B)
    function drawScatter() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // グリッド線
      ctx.strokeStyle = '#1e2433';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.moveTo(0, canvas.height / 2); ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();

      currentNewsData.forEach(item => {
        const isVisible = isItemVisible(item);

        // 座標計算 (マージン40px考慮)
        const x = 40 + (item.g / 255) * (canvas.width - 80);
        const y = canvas.height - (40 + (item.r / 255) * (canvas.height - 80));

        const radius = isVisible ? (selectedId === item.id ? 10 : 7) : 3;
        const alpha = isVisible ? (selectedId === item.id ? 1 : 0.85) : 0.12;

        // グロー（発光）エフェクト
        if (isVisible) {
          ctx.save();
          ctx.shadowBlur = selectedId === item.id ? 18 : 8;
          ctx.shadowColor = `rgb(${item.r}, ${item.g}, ${item.b})`;
          ctx.fillStyle = `rgba(${item.r}, ${item.g}, ${item.b}, ${alpha})`;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();

          if (selectedId === item.id) {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
          }
          ctx.restore();
        } else {
          ctx.fillStyle = 'rgba(75, 85, 99, 0.15)';
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    // キャンバスクリック判定
    function handleCanvasClick(e) {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      let nearestItem = null;
      let minDistance = 20;

      currentNewsData.forEach(item => {
        const x = 40 + (item.g / 255) * (canvas.width - 80);
        const y = canvas.height - (40 + (item.r / 255) * (canvas.height - 80));
        const dist = Math.hypot(clickX - x, clickY - y);
        if (dist < minDistance) {
          minDistance = dist;
          nearestItem = item;
        }
      });

      if (nearestItem) {
        selectArticle(nearestItem.id);
      }
    }

    // 記事リストのレンダリング
    function renderCards() {
      cardList.innerHTML = '';
      let visibleCount = 0;

      currentNewsData.forEach(item => {
        const isVisible = isItemVisible(item);
        if (isVisible) visibleCount++;

        const isRead = readingHistory.some(h => h.id === item.id);
        const itemReaction = userReactions[item.id];
        const card = document.createElement('div');
        card.className = `news-card ${selectedId === item.id ? 'selected' : ''}`;
        card.style.display = isVisible ? 'flex' : 'none';
        card.onclick = () => openModal(item);

        const colorTone = getColorToneName(item);
        const contrastColor = getContrastTextColor(item.r, item.g, item.b);

        let reactionBadge = '';
        if (itemReaction === 'agree') reactionBadge = '<span style="font-size:0.75rem;" title="共感">💖</span>';
        else if (itemReaction === 'dissent') reactionBadge = '<span style="font-size:0.75rem;" title="刺激的異論">⚡</span>';
        else if (itemReaction === 'insight') reactionBadge = '<span style="font-size:0.75rem;" title="目から鱗">💡</span>';
        else if (itemReaction === 'fact') reactionBadge = '<span style="font-size:0.75rem;" title="客観事実">📊</span>';

        card.innerHTML = `
          <div class="color-accent-bar" style="background: rgb(${item.r}, ${item.g}, ${item.b}); box-shadow: 0 0 10px rgb(${item.r}, ${item.g}, ${item.b});"></div>
          <div class="card-header-meta">
            <div class="badge-wrap">
              <span class="color-tag" style="background: rgb(${item.r}, ${item.g}, ${item.b}); color: ${contrastColor};">${colorTone}</span>
              ${item.is_constructive ? '<span style="font-size:0.68rem; color:#f472b6; border:1px solid #f472b6; padding:1px 5px; border-radius:3px;">★ 良質異論</span>' : ''}
              ${isRead ? '<span style="font-size:0.7rem; color:#4ade80; background:rgba(74,222,128,0.15); padding:1px 6px; border-radius:3px;">✓ 読了</span>' : ''}
              ${reactionBadge}
              <span class="source-text">${item.source}</span>
            </div>
            ${item.published_at ? `<span style="font-size:0.72rem; color:var(--text-sub); white-space:nowrap; margin-left:auto; display:inline-flex; align-items:center; gap:2px;">📅 ${item.published_at}</span>` : ''}
          </div>
          <div class="card-title">${item.title}</div>
          <div class="card-summary">${item.summary}</div>
          <div class="rgb-breakdown">
            <div class="rgb-item" style="color:#f87171;">興味: <span>${Math.round(item.r/2.55)}%</span></div>
            <div class="rgb-item" style="color:#4ade80;">思想近さ: <span>${Math.round(item.g/2.55)}%</span></div>
            <div class="rgb-item" style="color:#60a5fa;">客観事実: <span>${Math.round(item.b/2.55)}%</span></div>
          </div>
        `;

        cardList.appendChild(card);
      });

      document.getElementById('articleCount').textContent = `全${currentNewsData.length}件中 ${visibleCount}件表示`;
    }

    function selectArticle(id) {
      selectedId = id;
      drawScatter();
      renderCards();

      const targetCard = cardList.children[currentNewsData.findIndex(d => d.id === id)];
      if (targetCard) {
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function setPreset(type) {
      activePreset = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderCards();
      drawScatter();
    }

    function openModal(item) {
      selectedId = item.id;
      recordArticleRead(item); // 閲覧時に読了ログに記録
      drawScatter();
      renderCards();

      const modal = document.getElementById('detailModal');
      document.getElementById('modalTitle').textContent = item.title;
      document.getElementById('modalSource').textContent = item.source;
      document.getElementById('modalDate').textContent = item.published_at ? `📅 配信日時: ${item.published_at}` : '';
      document.getElementById('modalBody').textContent = item.body;

      // 3行要約の描画（バッジ付き構造化表示）
      const linesList = document.getElementById('modal3LinesList');
      linesList.innerHTML = '';
      const lines = (item.summary_3lines && item.summary_3lines.length > 0)
        ? item.summary_3lines
        : [`【事象の核心】${item.title}`, `【要因・背景】${item.summary}`, `【影響・論点】${item.source} の最新報道より`];

      const badgeStyles = [
        { label: '事象の核心', bg: 'rgba(99, 102, 241, 0.25)', border: '#818cf8', color: '#c7d2fe' },
        { label: '要因・背景', bg: 'rgba(16, 185, 129, 0.2)', border: '#34d399', color: '#a7f3d0' },
        { label: '影響・論点', bg: 'rgba(244, 63, 94, 0.2)', border: '#fb7185', color: '#fecdd3' }
      ];

      lines.forEach((lineText, idx) => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; align-items:flex-start; gap:10px; line-height:1.6; font-size:0.88rem; color:#f1f5f9;';

        const style = badgeStyles[idx % badgeStyles.length];
        let displayText = lineText;
        let badgeLabel = style.label;

        const match = lineText.match(/^【(.*?)】(.*)$/);
        if (match) {
          badgeLabel = match[1];
          displayText = match[2];
        }

        row.innerHTML = `
          <span style="flex-shrink:0; font-size:0.72rem; font-weight:700; padding:2px 8px; border-radius:4px; background:${style.bg}; border:1px solid ${style.border}; color:${style.color}; white-space:nowrap; margin-top:2px;">
            ${badgeLabel}
          </span>
          <span style="flex-grow:1; word-break:break-word;">
            ${displayText}
          </span>
        `;
        linesList.appendChild(row);
      });
      document.getElementById('modal3LinesBox').style.display = 'block';

      const linkEl = document.getElementById('modalLink');
      if (item.link) {
        linkEl.href = item.link;
        linkEl.style.display = 'inline-flex';
      } else {
        linkEl.style.display = 'none';
      }

      const tag = document.getElementById('modalTag');
      tag.textContent = getColorToneName(item);
      tag.style.background = `rgb(${item.r}, ${item.g}, ${item.b})`;
      tag.style.color = getContrastTextColor(item.r, item.g, item.b);

      const cushion = document.getElementById('modalCushion');
      const cushionText = document.getElementById('modalCushionText');
      cushionText.textContent = item.cushion;

      if (item.g < 80) {
        cushion.className = "ai-cushion-box";
      } else {
        cushion.className = "ai-cushion-box aligned";
      }

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
    }

    // 外側クリック・ESCキーでのモーダル閉じる確実化
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // ユーザーの実読了履歴に基づく知的摂取バランス診断
    function updateUserBalance() {
      const balanceText = document.getElementById('balanceText');
      const count = readingHistory.length;

      if (count === 0) {
        userBalanceOrb.style.background = '#4b5563';
        userBalanceOrb.style.boxShadow = '0 0 6px #4b5563';
        balanceText.textContent = "未摂取（記事を開いて閲覧）";
        balanceText.style.color = "#9ca3af";
        return;
      }

      let totalR = 0, totalG = 0, totalB = 0;
      readingHistory.forEach(d => {
        totalR += d.r; totalG += d.g; totalB += d.b;
      });
      const avgR = Math.round(totalR / count);
      const avgG = Math.round(totalG / count);
      const avgB = Math.round(totalB / count);

      userBalanceOrb.style.background = `rgb(${avgR}, ${avgG}, ${avgB})`;
      userBalanceOrb.style.boxShadow = `0 0 14px rgb(${avgR}, ${avgG}, ${avgB})`;

      if (avgR > 180 && avgG > 180 && avgB > 180) {
        balanceText.textContent = `完全調和 (${count}本読了: 理想的バランス)`;
        balanceText.style.color = "#ffffff";
      } else if (avgG > 180 && avgB < 110) {
        balanceText.textContent = `⚠️ 共感偏重 (${count}本: 事実や異論不足)`;
        balanceText.style.color = "#fcd34d";
      } else if (avgG < 110 && avgR > 160) {
        balanceText.textContent = `🔥 刺激過多 (${count}本: 異論を中心に接触)`;
        balanceText.style.color = "#f87171";
      } else if (avgB > 170) {
        balanceText.textContent = `🧊 事実重視 (${count}本: 冷静なデータ収集)`;
        balanceText.style.color = "#60a5fa";
      } else {
        balanceText.textContent = `多角摂取中 (${count}本読了)`;
        balanceText.style.color = "#c084fc";
      }
    }

    // Canvas画像によるインフォグラフィック生成＆SNSシェア
    function generateShareCard() {
      const count = readingHistory.length;
      if (count === 0) {
        alert("まだ記事を読んでいません。いくつか記事を読んでからシェアしてください！");
        return;
      }

      let totalR = 0, totalG = 0, totalB = 0;
      readingHistory.forEach(d => { totalR += d.r; totalG += d.g; totalB += d.b; });
      const avgR = Math.round(totalR / count);
      const avgG = Math.round(totalG / count);
      const avgB = Math.round(totalB / count);

      const offCanvas = document.createElement('canvas');
      offCanvas.width = 1000;
      offCanvas.height = 560;
      const oCtx = offCanvas.getContext('2d');

      // 背景グラデーション
      const bgGrad = oCtx.createLinearGradient(0, 0, 1000, 560);
      bgGrad.addColorStop(0, '#0b0d13');
      bgGrad.addColorStop(1, '#171c28');
      oCtx.fillStyle = bgGrad;
      oCtx.fillRect(0, 0, 1000, 560);

      // 装飾グロー
      oCtx.save();
      oCtx.shadowBlur = 60;
      oCtx.shadowColor = `rgb(${avgR}, ${avgG}, ${avgB})`;
      oCtx.fillStyle = `rgba(${avgR}, ${avgG}, ${avgB}, 0.25)`;
      oCtx.beginPath();
      oCtx.arc(500, 230, 90, 0, Math.PI * 2);
      oCtx.fill();
      oCtx.restore();

      // オーブ本体
      oCtx.save();
      oCtx.shadowBlur = 30;
      oCtx.shadowColor = `rgb(${avgR}, ${avgG}, ${avgB})`;
      oCtx.fillStyle = `rgb(${avgR}, ${avgG}, ${avgB})`;
      oCtx.beginPath();
      oCtx.arc(500, 230, 60, 0, Math.PI * 2);
      oCtx.fill();
      oCtx.restore();

      // テキスト描画
      oCtx.fillStyle = '#9ca3af';
      oCtx.font = 'bold 22px sans-serif';
      oCtx.textAlign = 'center';
      oCtx.fillText('NewsPrism 知的栄養バランス診断', 500, 70);

      oCtx.fillStyle = '#ffffff';
      oCtx.font = 'bold 36px sans-serif';
      oCtx.fillText(document.getElementById('balanceText').textContent, 500, 130);

      // メトリクス
      oCtx.font = '20px sans-serif';
      oCtx.fillStyle = '#f87171';
      oCtx.fillText(`興味(Red): ${Math.round(avgR/2.55)}%`, 300, 360);
      oCtx.fillStyle = '#4ade80';
      oCtx.fillText(`思想近さ(Green): ${Math.round(avgG/2.55)}%`, 500, 360);
      oCtx.fillStyle = '#60a5fa';
      oCtx.fillText(`客観事実(Blue): ${Math.round(avgB/2.55)}%`, 700, 360);

      oCtx.font = '16px sans-serif';
      oCtx.fillStyle = '#64748b';
      oCtx.fillText(`本日 ${count} 本読了 | 三原色でエコーチェンバーを解きほぐすニュース探索`, 500, 420);

      oCtx.font = 'bold 18px sans-serif';
      oCtx.fillStyle = '#818cf8';
      oCtx.fillText('https://kenokome.github.io/news_prism/', 500, 480);

      // 画像ダウンロード or Web Share
      offCanvas.toBlob(blob => {
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], 'newsprism_balance.png', { type: 'image/png' })] })) {
          navigator.share({
            title: 'NewsPrism 知的栄養バランス診断',
            text: `本日の私の知的摂取バランスは【${document.getElementById('balanceText').textContent}】でした！ #NewsPrism`,
            files: [new File([blob], 'newsprism_balance.png', { type: 'image/png' })]
          }).catch(() => {});
        } else {
          // ダウンロード & Xシェア画面オープン
          const a = document.createElement('a');
          a.download = `NewsPrism_Balance_${new Date().toISOString().slice(0,10)}.png`;
          a.href = offCanvas.toDataURL('image/png');
          a.click();

          const tweetText = encodeURIComponent(`本日の私の知的摂取バランスは【${document.getElementById('balanceText').textContent}】でした！三原色でニュースの偏りをチェック中。\nhttps://kenokome.github.io/news_prism/ #NewsPrism`);
          window.open(`https://twitter.com/intent/tweet?text=${tweetText}`, '_blank');
        }
      });
    }

    window.onload = init;
  </script>
